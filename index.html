<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Sync (PoC)</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase loader: tries multiple CDNs -->
  <script>
    // 1. Create the promise your app expects immediately
    // This prevents the "undefined" error if the bottom script runs too fast
    let resolveLoader;
    window.__supabase_load_promise__ = new Promise((resolve) => {
      resolveLoader = resolve;
    });
  </script>

  <script type="module">
    // 2. Import Supabase directly as a module (Modern Standard)
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // 3. Manually attach it to the window so your existing code works
    window.supabase = { createClient };

    // 4. Tell your app the library is ready
    resolveLoader({ ok: true, loadedFrom: 'ES Module (+esm)' });
  </script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
  <div class="max-w-xl mx-auto space-y-4">
    <h1 class="text-3xl font-bold">Family Sync (PoC)</h1>

    <div class="bg-gray-800 border border-gray-700 rounded-xl p-4">
      <div class="font-semibold text-lg">Status</div>
      <div id="status" class="text-sm text-gray-300 mt-2">Booting…</div>
    </div>

    <div class="bg-black/40 border border-gray-700 rounded-xl p-4">
      <div class="font-semibold text-lg mb-2">Debug</div>
      <pre id="debug" class="text-xs whitespace-pre-wrap text-gray-300">–</pre>
    </div>

    <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 space-y-3">
      <textarea id="input" rows="3"
        class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-sm"
        placeholder="Type something…"></textarea>

      <button id="postBtn"
        class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-semibold">
        Post
      </button>
    </div>

    <div id="notes" class="space-y-2"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://sznvcrjwiblgfvxnysoy.supabase.co";
    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6bnZjcmp3aWJsZ2Z2eG55c295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczNzA2ODAsImV4cCI6MjA4Mjk0NjY4MH0.cpwIj4osd8SX0jggNPuMesAtrYfCjCN9yB5XqhHhUwE";
    const TABLE = "notes";

    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const notesEl = document.getElementById("notes");
    const inputEl = document.getElementById("input");
    const postBtn = document.getElementById("postBtn");

    function setStatus(msg) { statusEl.textContent = msg; }
    function setDebug(obj) {
      debugEl.textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
    }

    function escapeText(s) {
      return String(s ?? "").replace(/[&<>"]/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"
      }[c]));
    }

    let supabase;

    async function boot() {
      setStatus("Loading Supabase library…");

      const result = await window.__supabase_load_promise__;
      setDebug({
        location: window.location.href,
        keyStartsWithEyJ: SUPABASE_KEY.startsWith("eyJ"),
        supabaseGlobalPresent: !!window.supabase,
        loaderResult: result
      });

      if (!result.ok) {
        setStatus("❌ Supabase library failed to load");
        notesEl.innerHTML = `
          <div class="text-red-400 text-sm">
            Supabase JS couldn't be loaded from CDN(s).<br/>
            Try disabling adblock / privacy extensions, or try a different network.
          </div>`;
        return;
      }

      setStatus(`Supabase loaded ✅ (${result.loadedFrom})`);

      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
      });

      setStatus("Supabase client created ✅");
      await fetchNotes();
    }

    async function fetchNotes() {
      setStatus("Fetching notes…");
      notesEl.innerHTML = `<div class="text-gray-500 text-sm">Fetching…</div>`;

      try {
        const { data, error } = await supabase
          .from(TABLE)
          .select("*")
          .order("created_at", { ascending: false })
          .limit(50);

        if (error) throw error;

        setStatus(`Connected ✅ (${data.length} notes)`);
        notesEl.innerHTML = "";

        if (!data.length) {
          notesEl.innerHTML = `<div class="text-gray-500 text-sm">No notes yet.</div>`;
          return;
        }

        for (const row of data) {
          const card = document.createElement("div");
          card.className = "bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm whitespace-pre-wrap";
          card.innerHTML = escapeText(row.content);
          notesEl.appendChild(card);
        }
      } catch (e) {
        setStatus("❌ Fetch failed");
        setDebug({
          ...JSON.parse(debugEl.textContent || "{}"),
          fetchError: { message: e.message, code: e.code, details: e.details, hint: e.hint }
        });
        notesEl.innerHTML = `<div class="text-red-400 text-sm">Fetch failed. See Debug.</div>`;
      }
    }

    postBtn.addEventListener("click", async () => {
      const text = inputEl.value.trim();
      if (!text || !supabase) return;

      postBtn.disabled = true;
      const old = postBtn.textContent;
      postBtn.textContent = "Posting…";

      try {
        const { error } = await supabase.from(TABLE).insert({ content: text });
        if (error) throw error;

        inputEl.value = "";
        await fetchNotes();
      } catch (e) {
        alert("Insert failed: " + e.message);
      } finally {
        postBtn.disabled = false;
        postBtn.textContent = old;
      }
    });

    boot();
  </script>
</body>
</html>
