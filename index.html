<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Sync – Diagnostic</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS v2 – UMD build (browser-safe) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-6">

  <div class="max-w-xl mx-auto space-y-4">

    <h1 class="text-2xl font-bold">Family Sync (PoC)</h1>

    <!-- STATUS -->
    <div class="bg-gray-800 border border-gray-700 rounded-lg p-4">
      <div class="font-semibold">Status</div>
      <div id="status" class="text-sm text-gray-300 mt-1">Booting…</div>
    </div>

    <!-- DEBUG -->
    <div class="bg-black/40 border border-gray-700 rounded-lg p-4">
      <div class="font-semibold mb-2">Debug</div>
      <pre id="debug" class="text-xs whitespace-pre-wrap text-gray-300">–</pre>
    </div>

    <!-- INPUT -->
    <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 space-y-3">
      <textarea
        id="input"
        rows="3"
        class="w-full p-3 bg-gray-900 border border-gray-700 rounded-md text-sm"
        placeholder="Type something…"></textarea>

      <button
        id="postBtn"
        class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-md text-sm font-semibold">
        Post
      </button>
    </div>

    <!-- NOTES -->
    <div id="notes" class="space-y-2"></div>

  </div>

<script>
/* -------------------------------------------------
   CONFIG — already filled with YOUR values
------------------------------------------------- */
const SUPABASE_URL = "https://sznvcrjwiblgfvxnysoy.supabase.co";
const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6bnZjcmp3aWJsZ2Z2eG55c295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczNzA2ODAsImV4cCI6MjA4Mjk0NjY4MH0.cpwIj4osd8SX0jggNPuMesAtrYfCjCN9yB5XqhHhUwE";

const TABLE = "notes";

/* -------------------------------------------------
   Helpers
------------------------------------------------- */
const statusEl = document.getElementById("status");
const debugEl  = document.getElementById("debug");
const notesEl  = document.getElementById("notes");
const inputEl  = document.getElementById("input");
const postBtn  = document.getElementById("postBtn");

function setStatus(msg) {
  statusEl.textContent = msg;
}

function setDebug(obj) {
  debugEl.textContent = typeof obj === "string"
    ? obj
    : JSON.stringify(obj, null, 2);
}

/* -------------------------------------------------
   Boot diagnostics
------------------------------------------------- */
setStatus("JS loaded ✅");

setDebug({
  location: window.location.href,
  hasWindowSupabase: !!window.supabase,
  keyStartsWithEyJ: SUPABASE_KEY.startsWith("eyJ")
});

if (!window.supabase) {
  setStatus("❌ Supabase library NOT loaded");
  throw new Error("Supabase UMD not found");
}

/* -------------------------------------------------
   Create client
------------------------------------------------- */
let supabase;
try {
  supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
      }
    }
  );
  setStatus("Supabase client created ✅");
} catch (e) {
  setStatus("❌ createClient failed");
  setDebug(String(e));
  throw e;
}

/* -------------------------------------------------
   Fetch notes
------------------------------------------------- */
async function fetchNotes() {
  setStatus("Fetching notes…");

  try {
    const { data, error } = await supabase
      .from(TABLE)
      .select("*")
      .order("created_at", { ascending: false })
      .limit(50);

    if (error) throw error;

    setStatus(`Connected ✅ (${data.length} rows)`);

    notesEl.innerHTML = "";
    if (data.length === 0) {
      notesEl.innerHTML =
        `<div class="text-gray-500 text-sm">No notes yet.</div>`;
      return;
    }

    for (const row of data) {
      const div = document.createElement("div");
      div.className =
        "bg-gray-800 border border-gray-700 rounded-md p-3 text-sm whitespace-pre-wrap";
      div.textContent = row.content;
      notesEl.appendChild(div);
    }

  } catch (e) {
    setStatus("❌ Fetch failed");
    setDebug({
      message: e.message,
      code: e.code,
      details: e.details,
      hint: e.hint
    });
  }
}

/* -------------------------------------------------
   Insert note
------------------------------------------------- */
postBtn.onclick = async () => {
  const text = inputEl.value.trim();
  if (!text) return;

  postBtn.disabled = true;
  postBtn.textContent = "Posting…";

  try {
    const { error } = await supabase
      .from(TABLE)
      .insert({ content: text });

    if (error) throw error;

    inputEl.value = "";
    await fetchNotes();
  } catch (e) {
    alert("Insert failed: " + e.message);
    setDebug(e);
  } finally {
    postBtn.disabled = false;
    postBtn.textContent = "Post";
  }
};

/* -------------------------------------------------
   Start
------------------------------------------------- */
fetchNotes();
</script>

</body>
</html>
