<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Debug Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white p-6">

    <h1 class="text-2xl text-red-500 font-bold mb-4">⚠️ Diagnostic Tool</h1>
    
    <div class="mb-4">
        <p><strong>Project URL:</strong> <span id="urlStatus">Checking...</span></p>
        <p><strong>API Key:</strong> <span id="keyStatus">Checking...</span></p>
        <p><strong>Connection:</strong> <span id="connStatus">Waiting...</span></p>
    </div>

    <div id="finalResult" class="p-4 rounded border border-gray-700 bg-gray-900 font-mono text-sm whitespace-pre-wrap">
        Running tests...
    </div>

    <script>
        // --- YOUR SETTINGS ---
        const SUPABASE_URL = 'https://sznvcrjwiblgfvxnysoy.supabase.co';
        
        // PASTE YOUR LEGACY KEY (The long one starting with eyJ...)
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6bnZjcmp3aWJsZ2Z2eG55c295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczNzA2ODAsImV4cCI6MjA4Mjk0NjY4MH0.cpwIj4osd8SX0jggNPuMesAtrYfCjCN9yB5XqhHhUwE'; 
        // ---------------------

        const resultBox = document.getElementById('finalResult');
        
        function log(msg, color = 'text-white') {
            const span = document.createElement('div');
            span.className = color;
            span.innerText = `> ${msg}`;
            resultBox.appendChild(span);
        }

        async function runDiagnostics() {
            // 1. Check URL
            document.getElementById('urlStatus').innerText = SUPABASE_URL ? "✅ Present" : "❌ Missing";
            
            // 2. Check Key format
            const keyEl = document.getElementById('keyStatus');
            if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_YOUR')) {
                keyEl.innerText = "❌ Missing or Default";
                log("FATAL: You have not pasted your API Key yet.", "text-red-500");
                return;
            } else if (SUPABASE_KEY.startsWith('sb_publishable')) {
                keyEl.innerText = "⚠️ Using New Key Format";
                log("WARNING: You are using the 'sb_publishable' key. The HTML file works best with the 'Legacy Anon' key (starts with eyJ...).", "text-yellow-400");
            } else if (SUPABASE_KEY.startsWith('eyJ')) {
                keyEl.innerText = "✅ Legacy Key Detected";
            } else {
                keyEl.innerText = "❓ Unknown Format";
            }

            // 3. Test Connection
            document.getElementById('connStatus').innerText = "Testing...";
            try {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                    auth: { persistSession: false }
                });

                const { data, error } = await supabase.from('notes').select('*').limit(1);

                if (error) {
                    document.getElementById('connStatus').innerText = "❌ Failed";
                    log(`SUPABASE ERROR: ${error.message}`, "text-red-500");
                    log(`Error Code: ${error.code}`, "text-gray-400");
                    
                    if (error.code === '42P01') log("Hint: The table 'notes' does not exist.", "text-blue-400");
                    if (error.code === 'PGRST301') log("Hint: RLS is blocking access. Disable RLS in Supabase.", "text-blue-400");
                    if (error.message.includes('API Key')) log("Hint: Your API Key is invalid.", "text-blue-400");
                } else {
                    document.getElementById('connStatus').innerText = "✅ SUCCESS!";
                    log("SUCCESS: Connection established! The database is reachable.", "text-green-500");
                    log(`Found ${data.length} notes.`, "text-gray-400");
                    log("You can now switch back to the main 'index.html' file.", "text-green-400");
                }

            } catch (err) {
                document.getElementById('connStatus').innerText = "❌ Network/Script Error";
                log(`BROWSER ERROR: ${err.message}`, "text-red-500");
            }
        }

        runDiagnostics();
    </script>
</body>
</html>
